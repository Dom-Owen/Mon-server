name: Sonde API (tests phase 2)

on:
  push:
    branches: [tests-api]
    paths: ['probe/**', '.github/workflows/probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Appeler les API candidates
        run: |
          mkdir -p results
          node probe/probe.mjs > results/probe-results.json
      - name: Enregistrer les résultats sur la branche
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add results/probe-results.json
          git commit -m "Résultats de la sonde API [skip ci]"
          git push
